name: Сборка Windows .exe

on:
  push:
    branches: [master]
    paths:
      - "voice-dictation/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voice-dictation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice-dictation/requirements.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Тесты
        run: pytest -q

      - name: Сборка .exe
        shell: bash
        run: |
          set -o pipefail
          pyinstaller VoiceDictation.spec --noconfirm 2>&1 | tee pyinstaller.log

      - name: Проверка результата
        shell: bash
        run: |
          test -f dist/VoiceDictation.exe
          ls -lh dist/VoiceDictation.exe
          # Без PortAudio программа запустится и умрёт на первой же диктовке,
          # поэтому отсутствие библиотеки — это провал сборки, а не предупреждение.
          if grep -qi "portaudio shared library not found" pyinstaller.log; then
            echo "PortAudio DLL не попала в сборку" >&2
            exit 1
          fi
          if ! grep -rqi "libportaudio" build/VoiceDictation/*.toc; then
            echo "PortAudio DLL не найдена в списке файлов сборки" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDictation-exe
          path: voice-dictation/dist/VoiceDictation.exe
          if-no-files-found: error

      - name: Публикация свежей сборки
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Скачай VoiceDictation.exe и запусти. Установка не нужна, Python не нужен.

          Первый запуск: откроется окно настроек, вставь ключ Gemini API и нажми «Сохранить и запустить».
          Дальше держи Ctrl+Alt+Space, говори, отпускай — текст появится сам.

          Файл не подписан сертификатом, поэтому Windows покажет синее окно SmartScreen:
          «Подробнее» → «Выполнить в любом случае»."

          # Релиз latest не удаляем: иначе есть окно, когда скачать нечего.
          # Файл в нём просто заменяется, ссылка на latest продолжает работать.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/VoiceDictation.exe --clobber
            gh release edit latest --title "Говорилка — свежая сборка" --notes "$NOTES"
          else
            gh release create latest dist/VoiceDictation.exe \
              --title "Говорилка — свежая сборка" --notes "$NOTES"
          fi
